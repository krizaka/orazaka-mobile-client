# Smoke flow: sign in on a fresh install, open a Studio, the jobs and the profile, sign out.
# Run on a simulator against the local Orazaka stack (edge :8088), signed in as the demo persona
# (`orazaka demo seed` — local only):
#   maestro test .maestro/smoke.yaml -e ORAZAKA_EMAIL=eric.morel@example.com -e ORAZAKA_PASSWORD=<password>
appId: com.krizaka.orazaka
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 60000
- tapOn: "Email"
- inputText: ${ORAZAKA_EMAIL}
- tapOn: "Password"
- inputText: ${ORAZAKA_PASSWORD}
# The password field submits the form (onSubmitEditing).
- pressKey: Enter
# iOS offers to save the password: decline.
- tapOn:
    text: "Not Now"
    optional: true
# A Studio card reads as one element: its name, tagline, profession and price.
- extendedWaitUntil:
    visible: "Génération d.image Une phrase.*"
    timeout: 30000
- tapOn: "Génération d.image Une phrase.*"
- assertVisible: "Installer"
- tapOn: "Tabs"
- tapOn: "Jobs.*"
- extendedWaitUntil:
    visible: "Tâches par jour"
    timeout: 20000
- tapOn: "Profil.*"
- assertVisible: ${ORAZAKA_EMAIL}
- tapOn: "Se déconnecter"
- assertVisible: "Sign in to your account"
