# The story recorded for the Orazaka site (home "On your phone", /gallery "A day of work", /docs/orazaka/mobile): the
# real app on an iOS simulator, signed in as the QA user, against the dev platform the app points at. Run it through
# scripts/record-story.mjs, which records the screen and receives the marks below (typing is sped up and waits are cut
# afterwards, labelled — never faked).
#   node scripts/record-story.mjs --appearance dark
# Needs -e ORAZAKA_EMAIL / ORAZAKA_PASSWORD (read from the QA file by the script, never printed).
appId: com.krizaka.orazaka
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 60000

# 1. Sign in
- runScript: { file: lib/mark.js, env: { NAME: "clip:sign-in:start" } }
- tapOn:
    id: "login-email"
- runScript: { file: lib/mark.js, env: { NAME: "type:start" } }
- inputText: ${ORAZAKA_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${ORAZAKA_PASSWORD}
- runScript: { file: lib/mark.js, env: { NAME: "type:end" } }
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "studio-image-generation"
    timeout: 30000
- waitForAnimationToEnd
- runScript: { file: lib/mark.js, env: { NAME: "clip:sign-in:end" } }

# 2. Run a Studio: a picture, from the phone
- runScript: { file: lib/mark.js, env: { NAME: "clip:studio-run:start" } }
- tapOn:
    id: "studio-image-generation"
- tapOn:
    id: "studio-open"
- tapOn:
    id: "field-prompt"
- runScript: { file: lib/mark.js, env: { NAME: "type:start" } }
- inputText: ${IMAGE_PROMPT}
- runScript: { file: lib/mark.js, env: { NAME: "type:end" } }
- pressKey: Enter
# The dev GPU is on demand: ask for the hosted image model so the run is certain to finish.
- tapOn: "More options"
- tapOn:
    id: "field-model"
- inputText: ${IMAGE_MODEL}
- pressKey: Enter
- tapOn:
    id: "run-launch"
- runScript: { file: lib/mark.js, env: { NAME: "wait:start", LABEL: "The image is rendering" } }
- extendedWaitUntil:
    visible: "Generated image"
    timeout: 300000
- runScript: { file: lib/mark.js, env: { NAME: "wait:end" } }
- waitForAnimationToEnd:
    timeout: 4000
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- runScript: { file: lib/mark.js, env: { NAME: "clip:studio-run:end" } }
- runFlow:
    file: story-video.yaml
    when:
      true: ${WITH_VIDEO == 'true'}
- tapOn: "Back"
- tapOn: "Back"

# 3. Ask: one real chat, streamed
- tapOn: "Chat"
- runScript: { file: lib/mark.js, env: { NAME: "clip:ask:start" } }
- tapOn: "Message Orazaka"
- runScript: { file: lib/mark.js, env: { NAME: "type:start" } }
- inputText: ${CHAT_PROMPT}
- runScript: { file: lib/mark.js, env: { NAME: "type:end" } }
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      id: "answer-complete"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- runScript: { file: lib/mark.js, env: { NAME: "clip:ask:end" } }

# 4. Follow the jobs, then the profile
- tapOn: "Jobs"
- runScript: { file: lib/mark.js, env: { NAME: "clip:jobs:start" } }
- extendedWaitUntil:
    visible: "Jobs per day"
    timeout: 30000
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 3000
- runScript: { file: lib/mark.js, env: { NAME: "clip:jobs:end" } }
