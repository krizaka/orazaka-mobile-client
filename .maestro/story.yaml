# The story recorded for krizaka.com/mobile and /docs/orazaka/mobile — on a simulator against the local Orazaka
# stack (edge :8088), signed in as the demo persona (`orazaka demo seed`):
#   xcrun simctl io booted recordVideo --codec h264 story.mp4 &
#   maestro test .maestro/story.yaml -e ORAZAKA_EMAIL=eric.morel@example.com -e ORAZAKA_PASSWORD=<password>
# sign in → generate a picture from the phone → a short clip, watched playing → a streamed chat answer → the jobs.
appId: com.krizaka.orazaka
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 60000
- tapOn: "Email"
- inputText: ${ORAZAKA_EMAIL}
- tapOn: "Password"
- inputText: ${ORAZAKA_PASSWORD}
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Génération d.image.*"
    timeout: 30000
# A picture, from the phone.
- tapOn: "Génération d.image.*"
- tapOn: "Ouvrir"
- tapOn:
    id: "field-prompt"
- inputText: ${IMAGE_PROMPT}
# The software keyboard (when the simulator shows one) hides the button: close it.
- runFlow:
    when:
      visible: "123"
    commands:
      - hideKeyboard
- tapOn: "Lancer"
- extendedWaitUntil:
    visible: "Votre image"
    timeout: 240000
- extendedWaitUntil:
    notVisible: "RUNNING"
    timeout: 5000
- tapOn:
    point: "14%,8%"
- tapOn:
    point: "14%,8%"
# A short clip, watched playing — only where a video engine is available (-e WITH_VIDEO=true).
- runFlow:
    file: story-video.yaml
    when:
      true: ${WITH_VIDEO == 'true'}
# A streamed answer.
- tapOn: "Chat.*"
- tapOn: "Message Orazaka…"
- inputText: ${CHAT_PROMPT}
- tapOn: "↑"
- waitForAnimationToEnd:
    timeout: 20000
# The jobs.
- tapOn: "Jobs.*"
- extendedWaitUntil:
    visible: "Tâches par jour"
    timeout: 20000
