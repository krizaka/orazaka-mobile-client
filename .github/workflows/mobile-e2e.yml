# The Maestro flows of .maestro on an Android emulator, on every pull request (the org's reusable mobile-e2e.yml,
# krizaka/.github#241). The check is `mobile-e2e / gate`; it always reports, so it can be a required check.
# Flows that need the dev platform and a QA account (smoke, story, story-video) are tagged `manual` and run by hand;
# the `ci` flows need no backend: the first screen, its fields and its sign-in rule, in French (the emulator's fr-CA).
name: Mobile E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-e2e:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/mobile-e2e.yml@1002810b78ccc24e284ec8209e8e0b55ff06ea33 # main (krizaka/.github#241, #243)
    with:
      app-id: com.krizaka.orazaka
      package-manager: npm
      # The reusable job always makes a demo account (a random password for this run); the ci flows do not sign in.
      demo-email: eric@demo.orazaka.test
      relevant: '^(src/|assets/|plugins/|\.maestro/|app\.(json|config\.js)$|package(-lock)?\.json$|babel\.config\.js$|metro\.config\.js$|\.github/workflows/mobile-e2e\.yml$)'
      env: |
        EXPO_PUBLIC_APP_ENV=dev
