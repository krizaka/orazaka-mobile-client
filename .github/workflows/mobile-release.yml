# Orazaka mobile builds, from CI, on Expo's servers (EAS): the iOS build goes to TestFlight, the Android APK to a GitHub release.
# Credentials are the org's secrets and variable (Expo token, Apple team, App Store Connect key). Never printed.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "ios (TestFlight), android (APK on a GitHub release) or all"
        default: all
        type: choice
        options: [all, ios, android]

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - name: App Store Connect access for EAS
        env:
          ASC_KEY_BODY: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ vars.ASC_KEY_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_BODY" > "$RUNNER_TEMP/asc-key.txt"
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const head = b64({ alg: "ES256", kid: process.env.ASC_KEY, typ: "JWT" });
            const body = b64({ iss: process.env.ASC_ISSUER, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = crypto.sign("sha256", Buffer.from(head + "." + body), { key: fs.readFileSync(process.env.RUNNER_TEMP + "/asc-key.txt"), dsaEncoding: "ieee-p1363" }).toString("base64url");
            fetch("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.krizaka.orazaka", { headers: { Authorization: "Bearer " + head + "." + body + "." + sig } })
              .then((r) => r.json())
              .then((j) => {
                const id = j.data && j.data[0] && j.data[0].id;
                if (!id) { console.error("No App Store Connect app with bundle id com.krizaka.orazaka: create the app record once (App Store Connect, Apps, +)."); process.exit(1); }
                const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
                eas.submit = { testflight: { ios: { ascAppId: id, ascApiKeyPath: process.env.RUNNER_TEMP + "/asc-key.txt", ascApiKeyIssuerId: process.env.ASC_ISSUER, ascApiKeyId: process.env.ASC_KEY, appleTeamId: process.env.TEAM } } };
                fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
              });'
      - name: Build for TestFlight and submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform ios --profile testflight --non-interactive --wait --auto-submit-with-profile=testflight

  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - name: Build the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > build.json
          node -e 'const b = JSON.parse(require("fs").readFileSync("build.json", "utf8"))[0]; if (!b.artifacts?.buildUrl) process.exit(1); console.log(b.artifacts.buildUrl)' > url.txt
          curl -fsSL "$(cat url.txt)" -o orazaka-android.apk
      - name: Publish on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" orazaka-android.apk --title "Orazaka for Android (dev build)" --notes "Installable APK of the dev build (not on Google Play: no account yet). Allow installs from this source, then open the file." --prerelease
