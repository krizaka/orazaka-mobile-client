# Read by the component pipeline's SonarCloud step (krizaka/orazaka component.yml, `sonar: true`), run from this repository's
# folder in the workspace after `npm run validate` wrote coverage/lcov.info (jest --coverage).
sonar.projectKey=krizaka_orazaka-mobile-client
sonar.organization=krizaka
sonar.sources=src,plugins,scripts
sonar.tests=src,plugins,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/__tests__/**,**/__fixtures__/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/__tests__/**,**/__fixtures__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
